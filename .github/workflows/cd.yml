name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Build
        run: scripts/buildprod.sh

      - name: Run database migrations
        run: scripts/migrateup.sh

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/753174272218/locations/global/workloadIdentityPools/github/providers/my-repo
          service_account: cloud-run-deployer@project-7a4f42c5-da0a-4b3d-801.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Push image to gcloud
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/project-7a4f42c5-da0a-4b3d-801/notely-ar-repo/notely:latest .

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/project-7a4f42c5-da0a-4b3d-801/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project project-7a4f42c5-da0a-4b3d-801 --max-instances=4
